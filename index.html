<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vampir Köylü</title>
</head>

<body>

    <h1>🧛 Vampir Köylü</h1>

    <h2>Oyuna Katıl</h2>

    <input
        id="username"
        type="text"
        placeholder="Kullanıcı adın"
    >

    <br>
    <br>

    <button id="createRoom">
        Oda Oluştur
    </button>

    <br>
    <br>

    <input
        id="roomCode"
        type="text"
        placeholder="Oda kodu"
    >

    <button id="joinRoom">
        Odaya Katıl
    </button>

    <p id="message"></p>

    <hr>

    <h2>🏠 Lobi</h2>

    <h3 id="currentRoom">
        Henüz bir odaya girmedin.
    </h3>

    <h3>
        Oyuncu sayısı:
        <span id="playerCount">0</span>
    </h3>

    <h3>Oyuncular</h3>

    <ul id="playerList"></ul>

    <br>

    <button
        id="startGameButton"
        style="display: none;"
    >
        🎮 Oyunu Başlat
    </button>

    <hr>

    <h3>💬 Chat</h3>

    <div id="messages"></div>

    <br>

    <input
        id="messageInput"
        type="text"
        placeholder="Mesaj yaz..."
    >

    <button id="sendButton">
        Gönder
    </button>

    <script src="/socket.io/socket.io.js"></script>

    <script>

        // ========================================
        // SOCKET
        // ========================================

        const socket = io();

        console.log(
            "INDEX SOCKET OLUŞTURULDU"
        );

        // ========================================
        // ELEMENTLER
        // ========================================

        const usernameInput =
            document.getElementById(
                "username"
            );

        const roomCodeInput =
            document.getElementById(
                "roomCode"
            );

        const createRoomButton =
            document.getElementById(
                "createRoom"
            );

        const joinRoomButton =
            document.getElementById(
                "joinRoom"
            );

        const message =
            document.getElementById(
                "message"
            );

        const currentRoom =
            document.getElementById(
                "currentRoom"
            );

        const playerList =
            document.getElementById(
                "playerList"
            );

        const playerCount =
            document.getElementById(
                "playerCount"
            );

        const startGameButton =
            document.getElementById(
                "startGameButton"
            );

        const messageInput =
            document.getElementById(
                "messageInput"
            );

        const sendButton =
            document.getElementById(
                "sendButton"
            );

        const messages =
            document.getElementById(
                "messages"
            );

        // ========================================
        // SOCKET BAĞLANDI
        // ========================================

        socket.on(
            "connect",
            () => {

                console.log(
                    "INDEX SOCKET BAĞLANDI:",
                    socket.id
                );

            }
        );

        // ========================================
        // SOCKET HATASI
        // ========================================

        socket.on(
            "connect_error",
            error => {

                console.error(
                    "SOCKET BAĞLANTI HATASI:",
                    error
                );

                message.textContent =
                    "❌ Sunucuya bağlanılamadı.";

            }
        );

        // ========================================
        // ODA OLUŞTUR
        // ========================================

        createRoomButton.addEventListener(
            "click",
            () => {

                console.log(
                    "ODA OLUŞTUR BUTONUNA BASILDI"
                );

                const username =
                    usernameInput.value.trim();

                if (!username) {

                    message.textContent =
                        "Önce kullanıcı adını yaz.";

                    return;
                }

                socket.emit(
                    "createRoom",
                    username
                );
            }
        );

        // ========================================
        // ODAYA KATIL
        // ========================================

        joinRoomButton.addEventListener(
            "click",
            () => {

                console.log(
                    "================================="
                );

                console.log(
                    "OYUNA KATIL BUTONUNA BASILDI"
                );

                const username =
                    usernameInput.value.trim();

                const roomCode =
                    roomCodeInput.value
                        .trim()
                        .toUpperCase();

                console.log(
                    "USERNAME:",
                    username
                );

                console.log(
                    "ROOM CODE:",
                    roomCode
                );

                console.log(
                    "SOCKET:",
                    socket.id
                );

                console.log(
                    "================================="
                );

                if (!username) {

                    message.textContent =
                        "Kullanıcı adını yaz.";

                    return;
                }

                if (!roomCode) {

                    message.textContent =
                        "Oda kodunu yaz.";

                    return;
                }

                socket.emit(
                    "joinRoom",
                    {
                        username:
                            username,

                        roomCode:
                            roomCode
                    },
                    response => {

                        console.log(
                            "JOIN SERVER CEVABI:",
                            response
                        );

                        if (
                            !response ||
                            !response.success
                        ) {

                            message.textContent =
                                "❌ " +
                                (
                                    response?.message ||
                                    "Odaya katılamadın."
                                );

                            return;
                        }

                        console.log(
                            "✅ ODAYA BAŞARIYLA KATILINDI"
                        );

                        localStorage.setItem(
                            "roomCode",
                            response.roomCode
                        );

                        localStorage.setItem(
                            "playerToken",
                            response.token
                        );

                        currentRoom.textContent =
                            "Oda kodu: " +
                            response.roomCode;

                        message.textContent =
                            "✅ Odaya başarıyla katıldın!";

                        startGameButton.style.display =
                            "none";
                    }
                );
            }
        );

        // ========================================
        // ODA OLUŞTURULDU
        // ========================================

        socket.on(
            "roomCreated",
            data => {

                console.log(
                    "ODA OLUŞTURULDU:",
                    data
                );

                localStorage.setItem(
                    "roomCode",
                    data.roomCode
                );

                localStorage.setItem(
                    "playerToken",
                    data.token
                );

                currentRoom.textContent =
                    "Oda kodu: " +
                    data.roomCode;

                roomCodeInput.value =
                    data.roomCode;

                message.textContent =
                    "✅ Oda oluşturuldu!";

                startGameButton.style.display =
                    "block";
            }
        );

        // ========================================
        // ODAYA KATILINDI
        // ========================================

        socket.on(
            "joinedRoom",
            data => {

                console.log(
                    "ODAYA KATILINDI:",
                    data
                );

            }
        );

        // ========================================
        // OYUNCU LİSTESİ
        // ========================================

        socket.on(
            "gamePlayers",
            players => {

                console.log(
                    "OYUNCU LİSTESİ GELDİ:",
                    players
                );

                playerList.innerHTML = "";

                playerCount.textContent =
                    players.length;

                players.forEach(
                    player => {

                        const li =
                            document.createElement(
                                "li"
                            );

                        if (
                            player.alive
                        ) {

                            li.textContent =
                                "🟢 " +
                                player.username;

                        } else {

                            li.textContent =
                                "💀 " +
                                player.username;
                        }

                        playerList.appendChild(
                            li
                        );
                    }
                );
            }
        );

        // ========================================
        // HOST
        // ========================================

        socket.on(
            "newHost",
            () => {

                console.log(
                    "YENİ HOST BENİM"
                );

                startGameButton.style.display =
                    "block";

                message.textContent =
                    "Artık oda sahibisin.";
            }
        );

        // ========================================
        // OYUNU BAŞLAT
        // ========================================

        startGameButton.addEventListener(
            "click",
            () => {

                console.log(
                    "OYUNU BAŞLAT BASILDI"
                );

                socket.emit(
                    "startGame"
                );
            }
        );

        // ========================================
        // OYUN BAŞLADI
        // ========================================

        socket.on(
            "gameStarted",
            data => {

                console.log(
                    "OYUN BAŞLADI:",
                    data
                );

                localStorage.setItem(
                    "gameData",
                    JSON.stringify(data)
                );

                localStorage.setItem(
                    "roomCode",
                    data.roomCode
                );

                window.location.href =
                    "/game.html";
            }
        );

        // ========================================
        // OYUN HATASI
        // ========================================

        socket.on(
            "gameError",
            error => {

                console.log(
                    "GAME ERROR:",
                    error
                );

                message.textContent =
                    error;
            }
        );

        // ========================================
        // ODA HATASI
        // ========================================

        socket.on(
            "roomError",
            error => {

                console.log(
                    "ROOM ERROR:",
                    error
                );

                message.textContent =
                    "❌ " + error;
            }
        );

        // ========================================
        // CHAT
        // ========================================

        sendButton.addEventListener(
            "click",
            sendMessage
        );

        messageInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter"
                ) {
                    sendMessage();
                }
            }
        );

        function sendMessage() {

            const text =
                messageInput.value.trim();

            if (!text) {
                return;
            }

            socket.emit(
                "chatMessage",
                text
            );

            messageInput.value = "";
        }

        // ========================================
        // CHAT MESAJI
        // ========================================

        socket.on(
            "chatMessage",
            data => {

                const p =
                    document.createElement(
                        "p"
                    );

                p.textContent =
                    data.username +
                    ": " +
                    data.message;

                messages.appendChild(p);
            }
        );

    </script>
    <link rel="stylesheet" href="/style.css">

<script src="/client.js" defer></script>



</body>

</html>
