<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vampir Köylü - Oyun</title>
    <link rel="stylesheet" href="/style.css">

</head>

<body>

    <main class="game-page">
        <h1>🧛 Vampir Köylü</h1>
        <p class="page-flow">Oyuna Katıl <span>›</span> Lobi & Chat <span>›</span> Oynanış & Chat</p>

        <section class="game-layout">
            <div class="game-panel">
                <h2 id="roleText">
                    Rol: -
                </h2>

                <h2 id="phaseText">
                    Faz: -
                </h2>

                <h1 id="timer">
                    00
                </h1>

                <hr>

                <h2>Oyuncular</h2>
                <ul id="playerList"></ul>

                <hr>

                <div id="nightArea">

                    <h2>🌙 Gece</h2>

                    <p id="nightInfo"></p>

                    <div id="nightPlayers"></div>

                </div>

                <div id="votingArea">

                    <h2>⚖️ Oylama</h2>

                    <p>
                        Kimi asmak istiyorsun?
                    </p>

                    <div id="votingPlayers"></div>
                </div>

                <div id="resultArea">

                    <h2>📢 Sonuç</h2>

                    <p id="resultText"></p>
                </div>

                <div id="gameOverArea">

                    <h2 id="winnerText"></h2>
                </div>
            </div>

            <aside class="chat-panel">
                <h2>💬 Oyun Chat'i</h2>
                <div id="messages" class="messages"></div>
                <input id="messageInput" type="text" placeholder="Mesaj yaz..." maxlength="300">
                <button id="sendButton">Gönder</button>
            </aside>
        </section>

        <button class="secondary-button" id="leaveButton">Ana Menü</button>
    </main>

    <script src="/socket.io/socket.io.js"></script>

    <script>

        // ========================================
        // SOCKET
        // ========================================

        const socket = io();

        let myRole = null;
        let myUsername = null;
        let roomCode = null;

        // ========================================
        // ELEMENTLER
        // ========================================

        const roleText =
            document.getElementById(
                "roleText"
            );

        const phaseText =
            document.getElementById(
                "phaseText"
            );

        const timer =
            document.getElementById(
                "timer"
            );

        const playerList =
            document.getElementById(
                "playerList"
            );

        const nightArea =
            document.getElementById(
                "nightArea"
            );

        const nightInfo =
            document.getElementById(
                "nightInfo"
            );

        const nightPlayers =
            document.getElementById(
                "nightPlayers"
            );

        const votingArea =
            document.getElementById(
                "votingArea"
            );

        const votingPlayers =
            document.getElementById(
                "votingPlayers"
            );

        const resultArea =
            document.getElementById(
                "resultArea"
            );

        const resultText =
            document.getElementById(
                "resultText"
            );

        const gameOverArea =
            document.getElementById(
                "gameOverArea"
            );

        const winnerText =
            document.getElementById(
                "winnerText"
            );

        // ========================================
        // BAŞLANGIÇ
        // ========================================

        nightArea.style.display =
            "none";

        votingArea.style.display =
            "none";

        resultArea.style.display =
            "none";

        gameOverArea.style.display =
            "none";

        // ========================================
        // SOCKET BAĞLANDI
        // ========================================

        socket.on(
            "connect",
            () => {

                console.log(
                    "GAME SOCKET BAĞLANDI:",
                    socket.id
                );

                roomCode =
                    localStorage.getItem(
                        "roomCode"
                    );

                const token =
                    localStorage.getItem(
                        "playerToken"
                    );

                if (
                    roomCode &&
                    token
                ) {

                    socket.emit(
                        "requestGameState",
                        {
                            roomCode:
                                roomCode,

                            token:
                                token
                        }
                    );
                } else {
                    window.location.href = "/";
                }
            }
        );

        // ========================================
        // OYUN BAŞLADI
        // ========================================

        socket.on(
            "gameStarted",
            data => {

                console.log(
                    "GAME STARTED:",
                    data
                );

                myUsername =
                    data.username;

                myRole =
                    data.role;

                roomCode =
                    data.roomCode;

                localStorage.setItem(
                    "gameData",
                    JSON.stringify(data)
                );

                localStorage.setItem(
                    "roomCode",
                    roomCode
                );

                roleText.textContent =
                    "Rolün: " +
                    myRole;
            }
        );

        // ========================================
        // OYUNCULAR
        // ========================================

        socket.on(
            "gamePlayers",
            players => {

                console.log(
                    "GAME PLAYERS:",
                    players
                );

                playerList.innerHTML =
                    "";

                players.forEach(
                    player => {

                        const li =
                            document.createElement(
                                "li"
                            );

                        if (
                            player.alive
                        ) {

                            li.textContent =
                                "🟢 " +
                                player.username;

                        } else {

                            li.textContent =
                                "💀 " +
                                player.username;
                        }

                        playerList.appendChild(
                            li
                        );
                    }
                );
            }
        );

        // ========================================
        // FAZ
        // ========================================

        socket.on(
            "phaseChanged",
            data => {

                console.log(
                    "PHASE:",
                    data
                );

                phaseText.textContent =
                    "Faz: " +
                    getPhaseName(
                        data.phase
                    );

                startTimer(
                    data.endTime
                );

                if (
                    data.phase ===
                    "night"
                ) {

                    nightArea.style.display =
                        "block";

                    votingArea.style.display =
                        "none";

                } else if (
                    data.phase ===
                    "discussion"
                ) {

                    nightArea.style.display =
                        "none";

                    votingArea.style.display =
                        "none";

                } else if (
                    data.phase ===
                    "voting"
                ) {

                    nightArea.style.display =
                        "none";

                    votingArea.style.display =
                        "block";
                }
            }
        );

        // ========================================
        // FAZ İSMİ
        // ========================================

        function getPhaseName(phase) {

            if (
                phase ===
                "night"
            ) {
                return "🌙 Gece";
            }

            if (
                phase ===
                "discussion"
            ) {
                return "☀️ Tartışma";
            }

            if (
                phase ===
                "voting"
            ) {
                return "⚖️ Oylama";
            }

            if (
                phase ===
                "gameover"
            ) {
                return "🏆 Oyun Bitti";
            }

            return phase;
        }

        // ========================================
        // TIMER
        // ========================================

        let timerInterval = null;

        function startTimer(endTime) {

            if (timerInterval) {
                clearInterval(
                    timerInterval
                );
            }

            function updateTimer() {

                const remaining =
                    Math.max(
                        0,
                        Math.ceil(
                            (
                                endTime -
                                Date.now()
                            ) / 1000
                        )
                    );

                timer.textContent =
                    String(
                        remaining
                    ).padStart(
                        2,
                        "0"
                    );

                if (
                    remaining <= 0
                ) {

                    clearInterval(
                        timerInterval
                    );
                }
            }

            updateTimer();

            timerInterval =
                setInterval(
                    updateTimer,
                    250
                );
        }

        // ========================================
        // GECE BAŞLADI
        // ========================================

        socket.on(
            "nightStarted",
            data => {

                myRole =
                    data.role;

                roleText.textContent =
                    "Rolün: " +
                    myRole;

                nightArea.style.display =
                    "block";

                votingArea.style.display =
                    "none";

                nightPlayers.innerHTML =
                    "";

                if (
                    myRole ===
                    "Vampir"
                ) {

                    nightInfo.textContent =
                        "Bir oyuncu seç ve öldür.";

                } else if (
                    myRole ===
                    "Doktor"
                ) {

                    nightInfo.textContent =
                        "Bir oyuncu seç ve kurtar.";

                } else if (
                    myRole ===
                    "Dedektif"
                ) {

                    nightInfo.textContent =
                        "Bir oyuncunun vampir olup olmadığını kontrol et.";

                } else {

                    nightInfo.textContent =
                        "Bu gece özel bir yeteneğin yok.";
                }

                createNightButtons();
            }
        );

        // ========================================
        // GECE BUTONLARI
        // ========================================

        function createNightButtons() {

            nightPlayers.innerHTML =
                "";

            const players =
                Array.from(
                    playerList.children
                );

            players.forEach(
                li => {

                    const username =
                        li.textContent
                            .replace("🟢 ", "")
                            .replace("💀 ", "")
                            .trim();

                    if (
                        !username ||
                        username ===
                        myUsername
                    ) {
                        return;
                    }

                    if (
                        li.textContent.includes(
                            "💀"
                        )
                    ) {
                        return;
                    }

                    const button =
                        document.createElement(
                            "button"
                        );

                    button.textContent =
                        username;

                    button.style.margin =
                        "5px";

                    button.addEventListener(
                        "click",
                        () => {

                            const player =
                                currentPlayers.find(
                                    p =>
                                        p.username ===
                                        username
                                );

                            if (!player) {
                                return;
                            }

                            if (
                                myRole ===
                                "Vampir"
                            ) {

                                socket.emit(
                                    "vampireKill",
                                    player.id
                                );

                            } else if (
                                myRole ===
                                "Doktor"
                            ) {

                                socket.emit(
                                    "doctorSave",
                                    player.id
                                );

                            } else if (
                                myRole ===
                                "Dedektif"
                            ) {

                                socket.emit(
                                    "detectiveCheck",
                                    player.id
                                );
                            }
                        }
                    );

                    nightPlayers.appendChild(
                        button
                    );
                }
            );
        }

        // ========================================
        // OYUNCULARI TUT
        // ========================================

        let currentPlayers = [];

        socket.on(
            "gamePlayers",
            players => {

                currentPlayers =
                    players;

                playerList.innerHTML =
                    "";

                players.forEach(
                    player => {

                        const li =
                            document.createElement(
                                "li"
                            );

                        li.textContent =
                            player.alive
                                ? "🟢 " +
                                  player.username
                                : "💀 " +
                                  player.username;

                        playerList.appendChild(
                            li
                        );
                    }
                );

                if (
                    myRole &&
                    phaseText.textContent.includes(
                        "Gece"
                    )
                ) {
                    createNightButtons();
                }
            }
        );

        // ========================================
        // OYLAMA BAŞLADI
        // ========================================

        socket.on(
            "votingStarted",
            () => {

                votingArea.style.display =
                    "block";

                nightArea.style.display =
                    "none";

                votingPlayers.innerHTML =
                    "";

                currentPlayers.forEach(
                    player => {

                        if (
                            !player.alive ||
                            player.username ===
                            myUsername
                        ) {
                            return;
                        }

                        const button =
                            document.createElement(
                                "button"
                            );

                        button.textContent =
                            "⚖️ " +
                            player.username;

                        button.style.margin =
                            "5px";

                        button.addEventListener(
                            "click",
                            () => {

                                socket.emit(
                                    "vote",
                                    player.id
                                );
                            }
                        );

                        votingPlayers.appendChild(
                            button
                        );
                    }
                );
            }
        );

        // ========================================
        // AKSİYON ONAYI
        // ========================================

        socket.on(
            "actionConfirmed",
            message => {

                alert(message);
            }
        );

        // ========================================
        // GECE SONUCU
        // ========================================

        socket.on(
            "nightResult",
            data => {

                resultArea.style.display =
                    "block";

                if (
                    data.killed
                ) {

                    resultText.textContent =
                        "🌙 Gece " +
                        data.killed +
                        " öldürüldü.";

                } else {

                    resultText.textContent =
                        "🌙 Bu gece kimse ölmedi.";
                }
            }
        );

        // ========================================
        // İDAM SONUCU
        // ========================================

        socket.on(
            "executionResult",
            data => {

                resultArea.style.display =
                    "block";

                if (
                    data.executed
                ) {

                    resultText.textContent =
                        "⚖️ " +
                        data.executed +
                        " asıldı. Rolü: " +
                        data.role +
                        " (" +
                        data.votes +
                        " oy)";

                } else {

                    resultText.textContent =
                        data.message;
                }
            }
        );

        // ========================================
        // DEDEKTİF SONUCU
        // ========================================

        socket.on(
            "detectiveResult",
            data => {

                alert(
                    data.username +
                    " → " +
                    (
                        data.isVampire
                            ? "🧛 VAMPİR"
                            : "🟢 VAMPİR DEĞİL"
                    )
                );
            }
        );

        // ========================================
        // OYUN BİTTİ
        // ========================================

        socket.on(
            "gameOver",
            data => {

                phaseText.textContent =
                    "🏆 Oyun Bitti";

                timer.textContent =
                    "00";

                nightArea.style.display =
                    "none";

                votingArea.style.display =
                    "none";

                gameOverArea.style.display =
                    "block";

                winnerText.textContent =
                    "🏆 Kazanan: " +
                    data.winner;
            }
        );

        // ========================================
        // ODA HATASI
        // ========================================

        socket.on(
            "roomError",
            error => {

                console.error(
                    "ROOM ERROR:",
                    error
                );

                alert(
                    "❌ " + error
                );
            }
        );

        function sendMessage() {
            const messageInput = document.getElementById("messageInput");
            const text = messageInput.value.trim();

            if (!text) {
                return;
            }

            socket.emit("chatMessage", text);
            messageInput.value = "";
        }

        document.getElementById("sendButton").addEventListener("click", sendMessage);
        document.getElementById("messageInput").addEventListener("keydown", event => {
            if (event.key === "Enter") {
                sendMessage();
            }
        });

        socket.on("chatMessage", data => {
            const item = document.createElement("p");
            item.textContent = data.username + ": " + data.message;
            document.getElementById("messages").appendChild(item);
            document.getElementById("messages").scrollTop =
                document.getElementById("messages").scrollHeight;
        });

        document.getElementById("leaveButton").addEventListener("click", () => {
            localStorage.removeItem("roomCode");
            localStorage.removeItem("playerToken");
            localStorage.removeItem("gameData");
            window.location.href = "/";
        });

    </script>

</body>

</html>
