<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vampir Köylü - Oyun</title>

</head>

<body>

    <h1>🧛 Vampir Köylü</h1>

    <h2 id="username">
        Oyuncu
    </h2>

    <h2>Rolün</h2>

    <h1 id="role">
        -
    </h1>

    <p id="roleDescription"></p>

    <hr>

    <h1 id="phase">
        Oyun hazırlanıyor...
    </h1>

    <h2>
        ⏱️
        <span id="timer">-</span>
    </h2>

    <p id="phaseMessage"></p>

    <hr>

    <h2>👥 Oyuncular</h2>

    <ul id="players"></ul>

    <hr>

    <h2>💬 Chat</h2>

    <div id="messages"></div>

    <br>

    <input
        id="messageInput"
        type="text"
        placeholder="Mesaj yaz..."
    >

    <button id="sendButton">
        Gönder
    </button>

    <hr>

    <h2 id="result"></h2>

    <script src="/socket.io/socket.io.js"></script>

    <script>

        // ========================================
        // SOCKET
        // ========================================

        const socket = io();

        console.log(
            "GAME SOCKET OLUŞTURULDU"
        );

        // ========================================
        // ELEMENTLER
        // ========================================

        const usernameElement =
            document.getElementById(
                "username"
            );

        const roleElement =
            document.getElementById(
                "role"
            );

        const roleDescription =
            document.getElementById(
                "roleDescription"
            );

        const phaseElement =
            document.getElementById(
                "phase"
            );

        const timerElement =
            document.getElementById(
                "timer"
            );

        const phaseMessage =
            document.getElementById(
                "phaseMessage"
            );

        const playersElement =
            document.getElementById(
                "players"
            );

        const messagesElement =
            document.getElementById(
                "messages"
            );

        const messageInput =
            document.getElementById(
                "messageInput"
            );

        const sendButton =
            document.getElementById(
                "sendButton"
            );

        const resultElement =
            document.getElementById(
                "result"
            );

        let players = [];

        let myRole = null;

        let timerInterval = null;

        // ========================================
        // SOCKET BAĞLANDI
        // ========================================

        socket.on(
            "connect",
            () => {

                console.log(
                    "GAME SOCKET BAĞLANDI:",
                    socket.id
                );

                const roomCode =
                    localStorage.getItem(
                        "roomCode"
                    );

                const playerToken =
                    localStorage.getItem(
                        "playerToken"
                    );

                console.log(
                    "ROOM CODE:",
                    roomCode
                );

                console.log(
                    "TOKEN:",
                    playerToken
                );

                if (
                    !roomCode ||
                    !playerToken
                ) {

                    phaseMessage.textContent =
                        "❌ Oyun bilgileri bulunamadı.";

                    return;
                }

                socket.emit(
                    "requestGameState",
                    {
                        roomCode:
                            roomCode,

                        token:
                            playerToken
                    }
                );
            }
        );

        // ========================================
        // OYUN BAŞLADI
        // ========================================

        socket.on(
            "gameStarted",
            data => {

                console.log(
                    "GAME STARTED:",
                    data
                );

                myRole =
                    data.role;

                usernameElement.textContent =
                    "👤 " +
                    data.username;

                roleElement.textContent =
                    data.role;

                localStorage.setItem(
                    "roomCode",
                    data.roomCode
                );

                if (
                    data.role ===
                    "Vampir"
                ) {

                    roleDescription.textContent =
                        "🩸 Gece bir oyuncuyu öldür.";

                }
                else if (
                    data.role ===
                    "Doktor"
                ) {

                    roleDescription.textContent =
                        "🩺 Gece bir oyuncuyu kurtar.";

                }
                else if (
                    data.role ===
                    "Dedektif"
                ) {

                    roleDescription.textContent =
                        "🔎 Gece bir oyuncuyu araştır.";

                }
                else {

                    roleDescription.textContent =
                        "👨‍🌾 Vampiri bul.";
                }
            }
        );

        // ========================================
        // OYUNCULAR
        // ========================================

        socket.on(
            "gamePlayers",
            serverPlayers => {

                console.log(
                    "GAME PLAYERS:",
                    serverPlayers
                );

                players =
                    serverPlayers;

                renderPlayers();
            }
        );

        function renderPlayers() {

            playersElement.innerHTML =
                "";

            players.forEach(
                player => {

                    const li =
                        document.createElement(
                            "li"
                        );

                    if (
                        player.alive
                    ) {

                        li.textContent =
                            "🟢 " +
                            player.username;

                    } else {

                        li.textContent =
                            "💀 " +
                            player.username +
                            " (Ölü)";
                    }

                    playersElement.appendChild(
                        li
                    );
                }
            );
        }

        // ========================================
        // FAZ
        // ========================================

        socket.on(
            "phaseChanged",
            data => {

                console.log(
                    "FAZ DEĞİŞTİ:",
                    data
                );

                if (
                    data.phase ===
                    "night"
                ) {

                    phaseElement.textContent =
                        "🌙 GECE";

                    phaseMessage.textContent =
                        "Gece başladı.";

                }
                else if (
                    data.phase ===
                    "discussion"
                ) {

                    phaseElement.textContent =
                        "☀️ GÜNDÜZ";

                    phaseMessage.textContent =
                        "Tartışma başladı.";

                }
                else if (
                    data.phase ===
                    "voting"
                ) {

                    phaseElement.textContent =
                        "🗳️ OYLAMA";

                    phaseMessage.textContent =
                        "Bir oyuncuya oy ver.";

                    renderVoting();
                }

                updateTimer(
                    data.endTime
                );
            }
        );

        // ========================================
        // TIMER
        // ========================================

        function updateTimer(
            endTime
        ) {

            clearInterval(
                timerInterval
            );

            function update() {

                const remaining =
                    Math.max(
                        0,
                        Math.ceil(
                            (
                                endTime -
                                Date.now()
                            ) / 1000
                        )
                    );

                timerElement.textContent =
                    remaining;

                if (
                    remaining <= 0
                ) {

                    clearInterval(
                        timerInterval
                    );
                }
            }

            update();

            timerInterval =
                setInterval(
                    update,
                    1000
                );
        }

        // ========================================
        // GECE
        // ========================================

        socket.on(
            "nightStarted",
            data => {

                console.log(
                    "GECE BAŞLADI:",
                    data
                );

                if (
                    data.role ===
                    "Vampir"
                ) {

                    phaseMessage.textContent =
                        "🩸 Bir oyuncu seç.";

                    renderNightTargets(
                        "vampireKill",
                        false
                    );

                }
                else if (
                    data.role ===
                    "Doktor"
                ) {

                    phaseMessage.textContent =
                        "🩺 Bir oyuncuyu kurtar.";

                    renderNightTargets(
                        "doctorSave",
                        true
                    );

                }
                else if (
                    data.role ===
                    "Dedektif"
                ) {

                    phaseMessage.textContent =
                        "🔎 Bir oyuncuyu araştır.";

                    renderNightTargets(
                        "detectiveCheck",
                        false
                    );

                }
                else {

                    phaseMessage.textContent =
                        "🌙 Geceyi bekle.";

                    renderPlayers();
                }
            }
        );

        // ========================================
        // GECE HEDEFLERİ
        // ========================================

        function renderNightTargets(
            eventName,
            canSelfTarget
        ) {

            playersElement.innerHTML =
                "";

            players.forEach(
                player => {

                    if (
                        !player.alive
                    ) {
                        return;
                    }

                    if (
                        !canSelfTarget &&
                        player.id ===
                        socket.id
                    ) {
                        return;
                    }

                    const li =
                        document.createElement(
                            "li"
                        );

                    const button =
                        document.createElement(
                            "button"
                        );

                    button.textContent =
                        player.username;

                    button.onclick =
                        () => {

                            console.log(
                                "GECE HEDEFİ:",
                                player.username
                            );

                            socket.emit(
                                eventName,
                                player.id
                            );
                        };

                    li.appendChild(
                        button
                    );

                    playersElement.appendChild(
                        li
                    );
                }
            );
        }

        // ========================================
        // OYLAMA
        // ========================================

        socket.on(
            "votingStarted",
            () => {

                phaseMessage.textContent =
                    "🗳️ Bir oyuncuya oy ver.";

                renderVoting();
            }
        );

        function renderVoting() {

            playersElement.innerHTML =
                "";

            players.forEach(
                player => {

                    if (
                        !player.alive
                    ) {
                        return;
                    }

                    if (
                        player.id ===
                        socket.id
                    ) {
                        return;
                    }

                    const li =
                        document.createElement(
                            "li"
                        );

                    const button =
                        document.createElement(
                            "button"
                        );

                    button.textContent =
                        "🗳️ " +
                        player.username;

                    button.onclick =
                        () => {

                            socket.emit(
                                "vote",
                                player.id
                            );

                            phaseMessage.textContent =
                                "✅ Oy verildi.";
                        };

                    li.appendChild(
                        button
                    );

                    playersElement.appendChild(
                        li
                    );
                }
            );
        }

        // ========================================
        // GECE SONUCU
        // ========================================

        socket.on(
            "nightResult",
            data => {

                if (
                    data.killed
                ) {

                    phaseMessage.textContent =
                        "☠️ " +
                        data.killed +
                        " gece öldü.";

                } else {

                    phaseMessage.textContent =
                        "🛡️ Bu gece kimse ölmedi.";
                }
            }
        );

        // ========================================
        // ASILMA
        // ========================================

        socket.on(
            "executionResult",
            data => {

                phaseElement.textContent =
                    "⚖️ ASILMA";

                if (
                    data.executed
                ) {

                    phaseMessage.textContent =
                        data.executed +
                        " asıldı! Rolü: " +
                        data.role +
                        " (" +
                        data.votes +
                        " oy)";

                } else {

                    phaseMessage.textContent =
                        data.message;
                }
            }
        );

        // ========================================
        // DEDEKTİF
        // ========================================

        socket.on(
            "detectiveResult",
            data => {

                if (
                    data.isVampire
                ) {

                    phaseMessage.textContent =
                        "🔎 " +
                        data.username +
                        " VAMPİR!";

                } else {

                    phaseMessage.textContent =
                        "🔎 " +
                        data.username +
                        " vampir değil.";
                }
            }
        );

        // ========================================
        // AKSİYON ONAY
        // ========================================

        socket.on(
            "actionConfirmed",
            text => {

                phaseMessage.textContent =
                    "✅ " +
                    text;
            }
        );

        // ========================================
        // OYUN BİTTİ
        // ========================================

        socket.on(
            "gameOver",
            data => {

                clearInterval(
                    timerInterval
                );

                phaseElement.textContent =
                    "🏁 OYUN BİTTİ";

                timerElement.textContent =
                    "-";

                if (
                    data.winner ===
                    "Köylüler"
                ) {

                    resultElement.textContent =
                        "🏆 KÖYLÜLER KAZANDI!";

                } else {

                    resultElement.textContent =
                        "🩸 VAMPİRLER KAZANDI!";
                }
            }
        );

        // ========================================
        // CHAT
        // ========================================

        sendButton.addEventListener(
            "click",
            sendMessage
        );

        messageInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter"
                ) {

                    sendMessage();
                }
            }
        );

        function sendMessage() {

            const text =
                messageInput.value.trim();

            if (!text) {
                return;
            }

            socket.emit(
                "chatMessage",
                text
            );

            messageInput.value =
                "";
        }

        socket.on(
            "chatMessage",
            data => {

                const p =
                    document.createElement(
                        "p"
                    );

                p.textContent =
                    data.username +
                    ": " +
                    data.message;

                messagesElement.appendChild(
                    p
                );
            }
        );

        // ========================================
        // HATA
        // ========================================

        socket.on(
            "roomError",
            error => {

                console.log(
                    "ROOM ERROR:",
                    error
                );

                phaseMessage.textContent =
                    "❌ " +
                    error;
            }
        );

    </script>

</body>

</html>
